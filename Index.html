<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dante Moretti — HOME v0.2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#090b0e;touch-action:none}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
#objective{position:absolute;top:max(22px,env(safe-area-inset-top));left:20px;font-size:13px;letter-spacing:1.4px;font-weight:700;text-shadow:0 2px 7px #000}
#sub{position:absolute;top:48px;left:20px;font-size:11px;opacity:.72;text-shadow:0 2px 5px #000}
#dialogue{position:absolute;left:6%;right:6%;bottom:16%;padding:17px 18px;background:linear-gradient(90deg,#050607e8,#050607bb);border-left:3px solid #fff;box-shadow:0 8px 30px #0008;opacity:0;transform:translateY(12px);transition:.25s;font-size:17px;line-height:1.4}
#name{font-weight:800;letter-spacing:1px;font-size:12px;margin-bottom:5px;opacity:.75}
#hint{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:12px;opacity:.75;text-shadow:0 2px 5px #000}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px 35px #0008;pointer-events:none}
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity 1.5s}
#stick{position:absolute;left:22px;bottom:24px;width:124px;height:124px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff35;pointer-events:auto}
#nub{position:absolute;left:35px;top:35px;width:54px;height:54px;border-radius:50%;background:#ffffff38;box-shadow:0 4px 18px #0008}
#act{position:absolute;right:25px;bottom:36px;width:78px;height:78px;border-radius:50%;border:2px solid #ffffff42;background:#ffffff17;color:#fff;font-weight:800;font-size:17px;pointer-events:auto}
#letterboxTop,#letterboxBottom{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;transition:height .7s}
#letterboxTop{top:0}.letterbox #letterboxTop,.letterbox #letterboxBottom{height:9vh}
#letterboxBottom{bottom:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="objective">OBJECTIVE • Spend some time with your family</div>
  <div id="sub">HOME • MIAMI, FLORIDA • 20:14</div>
  <div id="dialogue"><div id="name"></div><div id="line"></div></div>
  <div id="hint">Mueve a Dante con el joystick</div>
  <div id="vignette"></div>
</div>
<div id="stick"><div id="nub"></div></div><button id="act">E</button>
<div id="letterboxTop"></div><div id="letterboxBottom"></div><div id="fade"></div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr,px,py,phase=0,dx=0,dy=0,dialogueTimer=0,fade=document.getElementById('fade');
const world={w:2200,h:1500};
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
px=world.w*.53;py=world.h*.72;

const daughter={x:world.w*.30,y:world.h*.70};
const door={x:world.w*.53,y:world.h*.42};
let wife={x:world.w*.66,y:world.h*.47};

function say(name,text,ms=2500){document.getElementById('name').textContent=name;document.getElementById('line').textContent=text;let d=document.getElementById('dialogue');d.style.opacity=1;d.style.transform='translateY(0)';clearTimeout(dialogueTimer);dialogueTimer=setTimeout(()=>{d.style.opacity=0;d.style.transform='translateY(12px)'},ms)}
function setObj(a,b){document.getElementById('objective').textContent='OBJECTIVE • '+a;document.getElementById('hint').textContent=b||''}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function worldToScreen(x,y){return{x:x-px+W/2,y:y-py+H/2}}
function drawPerson(x,y,shirt,skin,scale=1){
 let s=worldToScreen(x,y);ctx.save();ctx.translate(s.x,s.y);ctx.scale(scale,scale);
 ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,17,19,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(-12,-4,24,34,8);ctx.fill();
 ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-14,11,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#1b1715';ctx.beginPath();ctx.arc(0,-17,10,Math.PI,Math.PI*2);ctx.fill();
 ctx.restore()
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let camX=px-W/2,camY=py-H/2;
 // sky
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#20152f');g.addColorStop(.48,'#b95d5c');g.addColorStop(.72,'#e1a66f');g.addColorStop(1,'#1a201c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun
 let sx=W*.78,sy=H*.20;let rg=ctx.createRadialGradient(sx,sy,10,sx,sy,95);rg.addColorStop(0,'#ffe7ad');rg.addColorStop(1,'#ffd58a00');ctx.fillStyle=rg;ctx.fillRect(sx-100,sy-100,200,200);
 // distant trees
 ctx.fillStyle='#151b18';for(let i=0;i<18;i++){let x=i*150-(camX*.12%150)-80;let y=H*.53+(i%3)*15;ctx.beginPath();ctx.arc(x,y,45,0,Math.PI*2);ctx.fill()}
 // ground
 ctx.fillStyle='#101613';ctx.fillRect(0,H*.57,W,H*.43);
 // driveway
 ctx.fillStyle='#68645b';ctx.beginPath();ctx.moveTo(W*.46,H);ctx.lineTo(W*.54,H);ctx.lineTo(W*.55,H*.56);ctx.lineTo(W*.48,H*.56);ctx.closePath();ctx.fill();
 // house
 let hx=W/2+(world.w*.53-camX)-world.w*.53; // centered relative to camera
 let house=worldToScreen(world.w*.53,world.h*.38);
 ctx.save();ctx.translate(house.x,house.y);
 ctx.fillStyle='#6e6257';ctx.fillRect(-310,0,620,350);
 ctx.fillStyle='#292426';ctx.beginPath();ctx.moveTo(-355,0);ctx.lineTo(0,-190);ctx.lineTo(355,0);ctx.closePath();ctx.fill();
 // porch
 ctx.fillStyle='#4b4039';ctx.fillRect(-350,300,700,50);
 // windows
 for(const wx of [-215,165]){ctx.fillStyle='#292321';ctx.fillRect(wx,75,92,120);ctx.fillStyle='#ffd98d';ctx.fillRect(wx+8,83,76,104)}
 // door
 ctx.fillStyle='#2a211e';ctx.fillRect(-45,160,90,190);ctx.fillStyle='#c59b62';ctx.beginPath();ctx.arc(25,255,5,0,Math.PI*2);ctx.fill();
 ctx.restore();
 // path lights
 for(let i=0;i<5;i++){let p=worldToScreen(world.w*.53,world.h*.66+i*85);ctx.fillStyle='#f6cf91';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(p.x-85,p.y,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+85,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 // people
 drawPerson(daughter.x,daughter.y,'#a64e5c','#d3a083',.95);
 drawPerson(wife.x,wife.y,'#d0b9a2','#c99576',.9);
 drawPerson(px,py,'#1d2229','#b88769',1.12);
 // subtle rain-like atmosphere
 ctx.fillStyle='#ffffff12';for(let i=0;i<35;i++){let x=(i*83+performance.now()*.015)%W,y=(i*47)%H;ctx.fillRect(x,y,1,10)}
 requestAnimationFrame(draw)
}
draw();

function update(){
 px+=dx*3.2;py+=dy*3.2;px=Math.max(150,Math.min(world.w-150,px));py=Math.max(200,Math.min(world.h-120,py));
 let dD=dist({x:px,y:py},daughter),dDoor=dist({x:px,y:py},door);
 if(phase===0 && dD<170){setObj('Talk to your daughter','Pulsa E');}
 if(phase===2 && dDoor<190){setObj('Go inside the house','Pulsa E');}
 if(phase===5 && dDoor<190){setObj('Say goodbye to your family','Pulsa E');}
 requestAnimationFrame(update)
}
update();

function action(){
 let dD=dist({x:px,y:py},daughter),dDoor=dist({x:px,y:py},door);
 if(phase===0 && dD<190){
  phase=1;say('SOFIA','Dad! You are home!',1900);
  setTimeout(()=>say('DANTE','Hey, sweetheart. Come here.',1800),2000);
  setTimeout(()=>{setObj('Walk toward the house','');phase=2},4000);
 } else if(phase===2 && dDoor<210){
  phase=3;document.body.classList.add('letterbox');say('DANTE','Smells good.',1500);
  setTimeout(()=>say('ELENA','You were supposed to be home an hour ago.',2200),1700);
  setTimeout(()=>say('DANTE','I know. I owe you one.',1700),4100);
  setTimeout(()=>{setObj('Spend the evening with your family','');phase=4},6200);
 } else if(phase===4){
  phase=5;say('DANTE','I could get used to this.',1800);
  setTimeout(()=>say('ELENA','You should.',1500),2000);
  setTimeout(()=>{setObj('Say goodbye to your family','Walk to the front door')},3800);
 } else if(phase===5 && dDoor<210){
  phase=6;say('DANTE','I will be back.',1500);
  setTimeout(()=>{say('ELENA','Be careful, Dante.',1700);},1700);
  setTimeout(()=>{document.body.classList.remove('letterbox');setObj('PROLOGUE • HOME','DEMO END • Next: THE LAST MISSION');},3700);
 }
}

const stick=document.getElementById('stick'),nub=document.getElementById('nub');let active=false;
function pointer(e){let p=e.touches?e.touches[0]:e,r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let vx=p.clientX-cx,vy=p.clientY-cy,m=Math.min(47,Math.hypot(vx,vy));let a=Math.atan2(vy,vx);dx=Math.cos(a)*m/47;dy=Math.sin(a)*m/47;nub.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`}
stick.addEventListener('touchstart',e=>{active=true;pointer(e);e.preventDefault()},{passive:false});
stick.addEventListener('touchmove',e=>{if(active)pointer(e);e.preventDefault()},{passive:false});
stick.addEventListener('touchend',()=>{active=false;dx=dy=0;nub.style.transform='translate(0,0)'});
document.getElementById('act').addEventListener('touchstart',e=>{action();e.preventDefault()},{passive:false});
setTimeout(()=>fade.style.opacity=0,300);
</script>
</body></html>
