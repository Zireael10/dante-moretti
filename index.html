<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dante Moretti — HOME v0.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0a;font-family:Arial,Helvetica,sans-serif;color:#fff}
#game{position:fixed;inset:0;overflow:hidden;background:#101614}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;text-shadow:0 2px 8px #000}
#objective{font-weight:800;letter-spacing:1.5px;font-size:clamp(13px,3.8vw,19px)}
#location{margin-top:8px;color:#c5c6c4;font-size:clamp(11px,3vw,15px);letter-spacing:1px}
#hint{position:absolute;left:50%;bottom:calc(105px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:80%;padding:9px 14px;border-radius:12px;background:#0009;border:1px solid #ffffff22;font-size:14px;text-align:center;opacity:.9}
#dialogue{position:absolute;left:5%;right:5%;bottom:calc(120px + env(safe-area-inset-bottom));padding:16px 18px;background:#0a0c0df2;border:1px solid #ffffff33;border-radius:16px;display:none;box-shadow:0 12px 40px #0009}
#dialogue .name{font-weight:800;letter-spacing:1px;margin-bottom:6px}
#dialogue .text{line-height:1.35;color:#eee}
#stick{position:absolute;left:28px;bottom:calc(28px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;border:2px solid #ffffff44;background:#ffffff0d;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:64px;height:64px;left:41px;top:41px;border-radius:50%;background:#8f9292aa;box-shadow:0 8px 20px #0008}
#action{position:absolute;right:28px;bottom:calc(46px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff0d;color:#fff;font-weight:800;font-size:22px;pointer-events:auto;touch-action:none}
#action:active{background:#ffffff22;transform:scale(.97)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1s}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 20px;background:#050606dd;border:1px solid #fff3;border-radius:14px;display:none;text-align:center}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud">
  <div id="top">
    <div id="objective">OBJECTIVE • <span id="objectiveText">Spend some time with your family</span></div>
    <div id="location">HOME • MIAMI, FLORIDA • 20:14</div>
  </div>
  <div id="hint">Mueve a Dante con el joystick</div>
  <div id="dialogue"><div class="name" id="dname"></div><div class="text" id="dtext"></div></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="action">E</button>
  <div id="toast"></div>
  <div id="fade"></div>
</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize); resize();

const player={x:.50,y:.74,speed:.00042};
const mom={x:.36,y:.69}, daughter={x:.63,y:.70};
let joy={x:0,y:0,active:false}, completed=false, dialogue=false, rain=[];
for(let i=0;i<90;i++) rain.push({x:Math.random(),y:Math.random(),s:.3+Math.random()*.8});
const stick=document.getElementById('stick'),knob=document.getElementById('knob'),action=document.getElementById('action');
function joyMove(e){
 const r=stick.getBoundingClientRect(), cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=(e.clientX-cx)/(r.width/2), y=(e.clientY-cy)/(r.height/2);
 const m=Math.hypot(x,y); if(m>1){x/=m;y/=m} joy.x=x;joy.y=y;
 knob.style.transform=`translate(${x*42}px,${y*42}px)`;
}
stick.addEventListener('pointerdown',e=>{joy.active=true;stick.setPointerCapture(e.pointerId);joyMove(e)});
stick.addEventListener('pointermove',e=>{if(joy.active)joyMove(e)});
stick.addEventListener('pointerup',()=>{joy.active=false;joy.x=joy.y=0;knob.style.transform=''});
stick.addEventListener('pointercancel',()=>{joy.active=false;joy.x=joy.y=0;knob.style.transform=''});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function showDialogue(name,text){
 document.getElementById('dname').textContent=name;
 document.getElementById('dtext').textContent=text;
 document.getElementById('dialogue').style.display='block';
 dialogue=true;
}
function closeDialogue(){document.getElementById('dialogue').style.display='none';dialogue=false}
function interact(){
 if(dialogue){closeDialogue();return}
 if(dist(player,mom)<.115){showDialogue('MAMÁ','Has vuelto. Ven, quédate un rato con nosotros.');return}
 if(dist(player,daughter)<.115){showDialogue('HIJA','¡Papá! Te estaba esperando.');return}
 if(player.y<.43 && Math.abs(player.x-.5)<.13){
   if(!completed){
     completed=true;
     document.getElementById('objectiveText').textContent='Objective complete • Spend some time with your family';
     document.getElementById('hint').textContent='Objetivo completado. Pulsa E para continuar';
     document.getElementById('toast').textContent='OBJETIVO COMPLETADO';
     document.getElementById('toast').style.display='block';
     setTimeout(()=>document.getElementById('toast').style.display='none',1800);
   }
 }
}
action.addEventListener('pointerdown',e=>{e.preventDefault();interact()});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e')interact()});

function draw(){
 ctx.clearRect(0,0,W,H);
 const horizon=H*.60;
 // sky
 let g=ctx.createLinearGradient(0,0,0,horizon);
 g.addColorStop(0,'#171421');g.addColorStop(.55,'#6e6870');g.addColorStop(1,'#a39786');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon);
 // moon
 ctx.fillStyle='#f4ce91';ctx.beginPath();ctx.arc(W*.74,H*.19,Math.min(W,H)*.09,0,Math.PI*2);ctx.fill();
 // distant glow
 ctx.fillStyle='#111a17';ctx.fillRect(0,horizon,W,H-horizon);
 // house shadow/body
 const hx=W*.14, hw=W*.72, hy=H*.39, hh=H*.43;
 ctx.fillStyle='#655e57';ctx.fillRect(hx,hy,hw,hh);
 // roof
 ctx.fillStyle='#272321';ctx.beginPath();ctx.moveTo(W*.11,hy+.03*H);ctx.lineTo(W*.5,H*.25);ctx.lineTo(W*.89,hy+.03*H);ctx.closePath();ctx.fill();
 // porch / door
 ctx.fillStyle='#211c1b';ctx.fillRect(W*.445,H*.53,W*.11,H*.29);
 ctx.fillStyle='#b08b4d';ctx.beginPath();ctx.arc(W*.535,H*.67,5,0,Math.PI*2);ctx.fill();
 // windows
 for(const wx of [W*.22,W*.67]){
  ctx.fillStyle='#1e1b1b';ctx.fillRect(wx,H*.49,W*.11,H*.12);
  ctx.fillStyle='#f5cf82';ctx.fillRect(wx+7,H*.49+7,W*.11-14,H*.12-14);
 }
 // path
 ctx.fillStyle='#79786d';ctx.beginPath();ctx.moveTo(W*.46,H*.99);ctx.lineTo(W*.54,H*.99);ctx.lineTo(W*.53,H*.67);ctx.lineTo(W*.47,H*.67);ctx.closePath();ctx.fill();
 // rain
 ctx.strokeStyle='#ffffff18';ctx.lineWidth=1;
 for(const r of rain){r.y+=.0035;if(r.y>1)r.y=0;ctx.beginPath();ctx.moveTo(r.x*W,r.y*H);ctx.lineTo(r.x*W-4,r.y*H+12);ctx.stroke()}
 // characters
 drawPerson(mom.x*W,mom.y*H,'#a64059','#e0a17d',.9);
 drawPerson(daughter.x*W,daughter.y*H,'#d27b61','#e3ad88',.8);
 drawPerson(player.x*W,player.y*H,'#1b2430','#bd8c6e',1);
 // proximity rings
 if(dist(player,mom)<.14||dist(player,daughter)<.14) {
  ctx.strokeStyle='#fff8';ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(player.x*W,player.y*H,44,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
 }
}
function drawPerson(x,y,body,skin,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,17,24,9,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-13,15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-17,2,34,47,10);ctx.fill();
 ctx.restore();
}
let last=performance.now();
function loop(t){
 const dt=Math.min(t-last,40);last=t;
 if(!dialogue){
   player.x+=joy.x*player.speed*dt;
   player.y+=joy.y*player.speed*dt;
   player.x=Math.max(.18,Math.min(.82,player.x));player.y=Math.max(.35,Math.min(.86,player.y));
 }
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
